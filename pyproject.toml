[project]
name = "code-review-harness"
version = "0.1.0"
description = "LLM-powered code review CLI (Ollama or OpenRouter) for security, bugs, quality, and best practices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
code-review = "code_review_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review_harness"]

[tool.hatch.build.targets.wheel.force-include]
"src/code_review_harness/prompts" = "code_review_harness/prompts"

[tool.hatch.build.targets.sdist]
only-include = ["src/code_review_harness", "README.md", "pyproject.toml", "LICENSE"]